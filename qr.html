<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR · Feliz 60, Mami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
<style>
  :root{
    --rose:#e0637f; --rose-deep:#c2415f; --blush:#ffd8dc; --cream:#fff7f6; --ink:#4a2230;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:"Poppins",system-ui,sans-serif;}
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:30px;
    background:
      radial-gradient(circle at 16% 10%, #ffe1e2 0%, transparent 42%),
      radial-gradient(circle at 84% 6%, #ffe8dd 0%, transparent 44%),
      radial-gradient(circle at 50% 100%, #ffe0e6 0%, transparent 55%),
      linear-gradient(180deg, #fff3f2, #ffe6e6 56%, #fbdcdd);
  }
  .card{
    position:relative;
    width:420px; max-width:100%;
    background:rgba(255,255,255,.96);
    border:1px solid var(--blush);
    border-radius:32px;
    padding:34px 30px 30px;
    text-align:center;
    box-shadow:0 1px 0 #fff inset, 0 26px 60px rgba(194,65,95,.22), 0 6px 0 0 #ffe4e2;
  }
  .card::before{
    content:"";
    position:absolute; inset:10px;
    border:1.5px dashed rgba(194,65,95,.3);
    border-radius:24px; pointer-events:none;
  }
  .eyebrow{
    display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.24em;
    font-weight:600; color:var(--rose-deep); margin:0 0 8px; padding:7px 18px;
    background:var(--cream); border:1px solid var(--blush); border-radius:999px;
    box-shadow:0 4px 10px rgba(194,65,95,.14);
  }
  h1{
    font-family:"DM Serif Display",Georgia,serif; font-weight:400; font-size:30px;
    color:var(--ink); margin:6px 0 2px;
  }
  .script{
    font-family:"Sacramento",cursive; font-size:30px; color:var(--rose-deep);
    margin:0 0 18px; text-shadow:0 1px 1px rgba(194,65,95,.18);
  }
  .qr-holder{
    display:inline-block; padding:16px; background:#fff; border-radius:26px;
    border:1px solid var(--blush);
    box-shadow:0 12px 30px rgba(194,65,95,.16), inset 0 0 0 6px #fff;
  }
  #qr canvas, #qr svg{display:block;border-radius:14px;}
  .scan{
    margin:18px 0 2px; font-family:"Sacramento",cursive; font-size:26px; color:var(--rose-deep);
  }
  .hint{ font-size:13px; color:var(--ink); margin:2px 0 0; }
  .code-pill{
    display:inline-block; margin-top:12px; font-weight:700; letter-spacing:.32em;
    color:#fff; background:linear-gradient(180deg,#ef8098,#d9536f);
    padding:8px 20px 8px 22px; border-radius:999px; font-size:15px;
    box-shadow:0 5px 0 #a83350, 0 12px 20px rgba(194,65,95,.28);
  }
  .code-label{ display:block; font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--rose-deep); margin:14px 0 4px; font-weight:600; }
  .foot{ margin-top:18px; font-size:11px; letter-spacing:.06em; color:#a86;}
  .heart{color:var(--rose);}
  .btns{margin-top:18px; display:flex; gap:10px; justify-content:center;}
  .btns button{
    border:none; cursor:pointer; font-family:"Poppins",sans-serif; font-weight:600; font-size:13px;
    color:#fff; background:linear-gradient(180deg,#ef8098,#d9536f); padding:11px 20px; border-radius:999px;
    box-shadow:0 4px 0 #a83350, 0 10px 18px rgba(194,65,95,.26); transition:transform .12s ease;
  }
  .btns button:active{transform:translateY(3px); box-shadow:0 1px 0 #a83350;}
  .corner{position:absolute; font-size:22px; color:var(--rose); opacity:.8;}
  .c1{top:14px; left:18px; transform:rotate(-12deg);}
  .c2{top:14px; right:18px; transform:rotate(12deg);}
</style>
</head>
<body>
  <div class="card" id="card">
    <span class="corner c1">❀</span>
    <span class="corner c2">✿</span>
    <p class="eyebrow">♡ un regalo para ti ♡</p>
    <h1>Feliz 60, Mami</h1>
    <p class="script">escanéame con tu cámara ♡</p>

    <div class="qr-holder"><div id="qr"></div></div>

    <p class="scan">una sorpresa te espera</p>
    <p class="hint">Abre la cámara de tu celular y apunta al código</p>

    <div class="btns">
      <button id="download">descargar QR ♡</button>
    </div>

    <p class="foot">hecho con <span class="heart">♥</span> por Santi</p>
  </div>

<script>
  const URL = "https://nyxarcrxzy.github.io/carta-mama-60/";
  const qr = new QRCodeStyling({
    width: 300,
    height: 300,
    type: "svg",
    data: URL,
    margin: 6,
    qrOptions: { errorCorrectionLevel: "H" },
    dotsOptions: {
      type: "rounded",
      gradient: {
        type: "linear", rotation: 0.79,
        colorStops: [
          { offset: 0, color: "#ef8098" },
          { offset: 1, color: "#c2415f" }
        ]
      }
    },
    backgroundOptions: { color: "#ffffff" },
    cornersSquareOptions: { type: "extra-rounded", color: "#c2415f" },
    cornersDotOptions: { type: "dot", color: "#e0637f" }
  });
  qr.append(document.getElementById("qr"));

  document.getElementById("download").addEventListener("click", () => {
    qr.download({ name: "qr-feliz-60-mami", extension: "png" });
  });
</script>
</body>
</html>
